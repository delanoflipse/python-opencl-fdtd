[project]
name = "python-opencl-fdtd"
version = "0.1.0"
description = "OpenCL accelerated acoustic finite difference simulation"
readme = "readme.md"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "numba",
    "scipy",
    "matplotlib",
    "pyopencl",
    "siphash24>=1.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fdtd"]
